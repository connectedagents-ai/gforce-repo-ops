[project]
name = "gforce-agents"
version = "0.1.0"
description = "G Force Repo Ops — Multi-LLM agent orchestration layer"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",

    # OpenAI-compatible client (works with Hermes, OpenRouter, Gemini, etc.)
    "openai>=1.55.0",

    # Google Gemini
    "google-generativeai>=0.8.0",

    # Anthropic Claude
    "anthropic>=0.40.0",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",

    # GitHub API
    "PyGithub>=2.4.0",

    # Config + env
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Async utilities
    "anyio>=4.6.0",
    "aiohttp>=3.10.0",

    # Observability
    "structlog>=24.4.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",  # HTTP mock for httpx
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
