[project]
name = "gforce-gripper-bridge"
version = "0.1.0"
description = "FastAPI gripper bridge for Raspberry Pi"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
pi = [
    "RPi.GPIO>=0.7.1",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",  # For test client
]

[tool.ruff]
target-version = "py310"
line-length = 100
