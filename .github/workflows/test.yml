name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd agents
          uv sync --all-extras

      - name: Run tests (network-blocked)
        env:
          ENVIRONMENT: test
          # All real API keys are mocked in tests
          OPENROUTER_API_KEY: test_key_mock
          GITHUB_TOKEN: test_token_mock
          PI_HOST: localhost
        run: |
          cd agents
          uv run pytest tests/ -x -v \
            --tb=short \
            --no-header \
            -p no:socket \
            --timeout=30

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
